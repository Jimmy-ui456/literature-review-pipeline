[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "d-pan-literature-pipeline"
version = "3.0.0"
description = "Topic-configurable microbial metabolic engineering literature evidence pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "openpyxl>=3.1,<4",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
citations = ["lxml>=5,<7", "pywin32>=306,<400; sys_platform == 'win32'"]
tables = ["pdfplumber>=0.11,<0.12"]
ocr = ["pdfplumber>=0.11,<0.12", "pypdfium2>=4.30,<6", "Pillow>=10,<13"]
parsing = ["pdfplumber>=0.11,<0.12", "pypdfium2>=4.30,<6", "Pillow>=10,<13"]
test = ["reportlab>=4,<5"]
release = ["build>=1.2,<2", "setuptools>=77", "wheel>=0.45,<1"]

[project.scripts]
literature-search = "litsearch.cli:main"
engineering-review = "litsearch.engineering:main"
literature-service-probe = "litsearch.service_probe:main"
literature-discover = "litsearch.discovery:main"
literature-parse = "litsearch.document_parse:main"
literature-cite = "litsearch_zotero.dynamic_citations:main"
literature-cite-word = "litsearch_zotero.word_plugin:main"

[tool.setuptools.packages.find]
include = ["litsearch*", "litsearch_zotero*"]

[tool.setuptools.package-data]
litsearch = ["profiles/*.json"]

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
