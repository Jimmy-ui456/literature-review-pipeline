name: package-validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and build tools
        run: python -m pip install --upgrade pip build "setuptools>=77" "wheel>=0.45,<1"
      - name: Generate and gate release from the source checkout
        run: python scripts/build_release.py --out-dir dist/ci-release
      - name: Install built wheel
        run: python -m pip install --force-reinstall "dist/ci-release/artifacts/d_pan_literature_pipeline-3.0.0-py3-none-any.whl[parsing,test,citations]"
      - name: Install OCR engine for synthetic integration checks
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Validate installed wheel outside checkout
        run: python dist/ci-release/source/scripts/ci_validate_installed.py --fixture-source dist/ci-release/source --source-root . --demo-out .validation/ci-demo
